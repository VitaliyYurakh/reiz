name: CI / Deploy

# Single workflow: CI runs first, deploy waits for it. Without the gate a
# broken Prisma schema or a build error would still SCP to prod and crash
# the container.
#
# CI is intentionally non-pedantic at first: `tsc --noEmit` runs as a
# `continue-on-error` step until the small backlog of pre-existing type
# warnings is cleaned up. The hard gates are `prisma validate`,
# `prisma format --check`, and successful tsc emit / Next build — those
# catch the mistakes that actually break the running container.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # CI is intentionally narrow: validate Prisma schemas (catches the
    # mistakes that have actually broken prod — invalid migrations, env
    # references that fail to resolve at startup) and stop. The TS build
    # is exercised on every deploy by the Docker multi-stage in
    # api/Dockerfile and front/Dockerfile, so a syntax error fails the
    # `docker compose up --build` step and the deploy SSH never starts.
    # Adding `tsc` here today would gate on a backlog of pre-existing
    # type warnings — false-positive that would block real fixes from
    # shipping. When that backlog is cleaned up we can re-introduce
    # `npm run build` to fail fast.
    schema:
        name: ci · prisma schemas
        runs-on: ubuntu-latest
        env:
            # `prisma validate` resolves env() in the schema (api uses
            # DATABASE_URL, front uses the same). Anything that parses as
            # a postgres URL works — we never connect.
            DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Validate api schema
              working-directory: api
              run: |
                  npm install --no-save --no-audit --no-fund prisma@^6
                  npx prisma validate

            - name: Validate front schema
              working-directory: front
              run: |
                  npm install --no-save --no-audit --no-fund prisma@^6
                  npx prisma validate

    deploy:
        name: deploy · prod
        runs-on: ubuntu-latest
        # Only deploy on push to main (not on PRs) and only after CI passes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [schema]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Clean old source on server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      rm -rf /opt/reiz/front/src /opt/reiz/api/app /opt/reiz/api/prisma

            - name: Copy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: '.'
                  target: '/opt/reiz'

            - name: Create .env file for docker-compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd /opt/reiz
                      cat > .env << 'EOF'
                      API_SECRET=${{ secrets.API_SECRET }}
                      API_SALT=${{ secrets.API_SALT }}
                      TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
                      TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
                      AUTH_SECRET=${{ secrets.AUTH_SECRET }}
                      SERVICE_SECRET=${{ secrets.SERVICE_SECRET }}
                      GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                      GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                      TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
                      POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                      ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}
                      GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
                      GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
                      GMAIL_USER=${{ secrets.GMAIL_USER }}
                      GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
                      OUTREACH_DAILY_CAP=${{ vars.OUTREACH_DAILY_CAP || '5' }}
                      OUTREACH_PUBLIC_URL=${{ vars.OUTREACH_PUBLIC_URL || 'https://reiz.com.ua' }}
                      OUTREACH_SENDER_NAME=${{ vars.OUTREACH_SENDER_NAME || 'Марьян, основатель REIZ' }}
                      MAIL_USER=${{ secrets.MAIL_USER }}
                      MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
                      MAIL_DISPLAY_NAME=${{ vars.MAIL_DISPLAY_NAME || 'REIZ' }}
                      MAIL_IMAP_HOST=${{ vars.MAIL_IMAP_HOST || 'imap.hostinger.com' }}
                      MAIL_SMTP_HOST=${{ vars.MAIL_SMTP_HOST || 'smtp.hostinger.com' }}
                      EOF
                      chmod 600 .env

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd /opt/reiz
                      docker compose down
                      docker compose up --build -d
