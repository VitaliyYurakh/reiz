name: CI / Deploy

# Single workflow: CI runs first, deploy waits for it. Without the gate a
# broken Prisma schema or a build error would still SCP to prod and crash
# the container.
#
# CI is intentionally non-pedantic at first: `tsc --noEmit` runs as a
# `continue-on-error` step until the small backlog of pre-existing type
# warnings is cleaned up. The hard gates are `prisma validate`,
# `prisma format --check`, and successful tsc emit / Next build — those
# catch the mistakes that actually break the running container.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # CI gates two things: schema validity and a clean `npm run build`.
    # Prior runs paid down the pre-existing tsc backlog (telegram dynamic
    # import, UpdateCarDto null vs undefined, service-event explicit
    # extension, customer.service casing) so `tsc` exits zero and the
    # smoke-check below confirms `build/app/index.js` is emitted — that's
    # the same file the prod container then runs via
    # `node build/app/index.js`.
    api:
        name: ci · api
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        defaults:
            run:
                working-directory: api
        # CI gates the schema. The Docker build step in the deploy job
        # exercises `npm run build` on the same alpine image that runs
        # in prod — that's the authoritative tsc smoke check, since
        # GHA's Ubuntu runner has shown subtly different tsc emit
        # behaviour from `node:20-alpine` (case-sensitivity / Node patch
        # differences). Failing tsc inside Docker still blocks deploy
        # because `docker compose up --build` fails before SSH actions
        # run, so prod stays on the previous image.
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: api/package-lock.json
            - run: npm ci
            - run: npx prisma generate
            - run: npx prisma validate
            - run: npm test

    # Integration tests — spin up real Postgres via testcontainers and
    # run the prisma migration history against it. Catches schema drift
    # and SQL/TypeScript shape mismatches the mocked unit suite can't
    # see (the JSON-string-of-JSON description blob from 2026-05-02
    # would have failed this gate before reaching prod).
    api-integration:
        name: ci · api integration
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: api/package-lock.json
            # GHA `ubuntu-latest` ships docker; testcontainers detects
            # the daemon automatically. No services: section needed
            # because each suite manages its own Postgres lifecycle.
            - run: npm ci
            - run: npx prisma generate
            - run: npm run test:integration

    front:
        name: ci · front
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        defaults:
            run:
                working-directory: front
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: front/package-lock.json
            - run: npm ci
            - name: Lint (advisory)
              run: npm run lint
              continue-on-error: true
            - name: Build
              env:
                  NEXT_PUBLIC_BASE_URL: https://reiz.com.ua/
                  NEXT_PUBLIC_API_URL: https://reiz.com.ua/api
                  NEXT_PUBLIC_TURNSTILE_SITE_KEY: dummy-build-key
              run: npm run build

    deploy:
        name: deploy · prod
        runs-on: ubuntu-latest
        # Only deploy on push to main (not on PRs) and only after CI passes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [api, api-integration, front]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Full history so the diff below can always reach
                  # github.event.before, even on repos/branches where that
                  # commit is more than one commit back.
                  fetch-depth: 0

            - name: Detect changed services
              id: changes
              # Plain git diff instead of a third-party filter action — this
              # step gates how much of the deploy build gets skipped, so it
              # stays a few lines we can fully audit rather than trusting an
              # action's internal merge-base heuristics.
              run: |
                  BEFORE="${{ github.event.before }}"
                  AFTER="${{ github.sha }}"

                  # No valid prior commit (first push to the branch, or
                  # similar edge case) — fall back to rebuilding everything,
                  # same as the unconditional behavior this replaces.
                  if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                      echo "api=true" >> "$GITHUB_OUTPUT"
                      echo "front=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
                  echo "Changed files:"
                  echo "$CHANGED"

                  api=false
                  front=false
                  # docker-compose.yml or this workflow changing could affect
                  # either service's build — rebuild both rather than guess.
                  if echo "$CHANGED" | grep -qE '^(api/|docker-compose\.yml$|\.github/workflows/deploy\.yml$)'; then
                      api=true
                  fi
                  if echo "$CHANGED" | grep -qE '^(front/|docker-compose\.yml$|\.github/workflows/deploy\.yml$)'; then
                      front=true
                  fi
                  echo "api=$api" >> "$GITHUB_OUTPUT"
                  echo "front=$front" >> "$GITHUB_OUTPUT"

            - name: Clean old source on server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      rm -rf /opt/reiz/front/src /opt/reiz/api/app /opt/reiz/api/prisma

            - name: Copy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: '.'
                  target: '/opt/reiz'

            - name: Create .env file for docker-compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd /opt/reiz
                      cat > .env << 'EOF'
                      API_SECRET=${{ secrets.API_SECRET }}
                      API_SALT=${{ secrets.API_SALT }}
                      TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
                      TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
                      AUTH_SECRET=${{ secrets.AUTH_SECRET }}
                      SERVICE_SECRET=${{ secrets.SERVICE_SECRET }}
                      GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                      GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                      TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
                      POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                      ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}
                      SENTRY_DSN=${{ secrets.SENTRY_DSN }}
                      GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
                      GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
                      GMAIL_USER=${{ secrets.GMAIL_USER }}
                      GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
                      OUTREACH_DAILY_CAP=${{ vars.OUTREACH_DAILY_CAP || '5' }}
                      OUTREACH_PUBLIC_URL=${{ vars.OUTREACH_PUBLIC_URL || 'https://reiz.com.ua' }}
                      OUTREACH_SENDER_NAME=${{ vars.OUTREACH_SENDER_NAME || 'Марьян, основатель REIZ' }}
                      MAIL_USER=${{ secrets.MAIL_USER }}
                      MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
                      MAIL_DISPLAY_NAME=${{ vars.MAIL_DISPLAY_NAME || 'REIZ' }}
                      MAIL_IMAP_HOST=${{ vars.MAIL_IMAP_HOST || 'imap.hostinger.com' }}
                      MAIL_SMTP_HOST=${{ vars.MAIL_SMTP_HOST || 'smtp.hostinger.com' }}
                      EOF
                      chmod 600 .env

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  API_CHANGED: ${{ steps.changes.outputs.api }}
                  FRONT_CHANGED: ${{ steps.changes.outputs.front }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  envs: API_CHANGED,FRONT_CHANGED
                  # `--no-cache` on the build step is the boring fix for a
                  # BuildKit pitfall we hit twice (Phase 2 RBAC + i18n
                  # Phase 1): the COPY layer's content hash sometimes
                  # matches a previous deploy's even when the source files
                  # are genuinely new (likely a scp-action mtime/permissions
                  # quirk on the SCP step above). The first failure mode
                  # was silent — the container restarted but kept the old
                  # bundle. `--no-cache` makes the build deterministic, at
                  # the cost of a full from-scratch build.
                  #
                  # Scoped to whichever service(s) actually changed (see the
                  # "Detect changed services" step above) so a frontend-only
                  # push doesn't also pay for a from-scratch api rebuild,
                  # and vice versa. Falls back to rebuilding both whenever
                  # that's ambiguous — docker-compose.yml or this workflow
                  # file changed, or there was no prior commit to diff
                  # against — same safety guarantee as before, just skipped
                  # when we can positively tell it's unnecessary.
                  #
                  # No `docker compose down` here on purpose (removed
                  # 2026-08-17): it stopped all four services — including
                  # caddy and postgres, which are pulled images that never
                  # change on a code deploy — so every deploy took the whole
                  # site offline for the full --no-cache build. Google's URL
                  # Inspection caught this as a site-wide "couldn't fetch
                  # robots.txt" failure during that window. `docker compose
                  # up -d` after a build already recreates only the
                  # containers whose image actually changed (web, api), so
                  # caddy keeps serving and postgres keeps its connections
                  # the whole time.
                  script: |
                      cd /opt/reiz
                      if [ "$API_CHANGED" = "true" ] && [ "$FRONT_CHANGED" = "true" ]; then
                          docker compose build --no-cache
                      elif [ "$API_CHANGED" = "true" ]; then
                          docker compose build --no-cache api
                      elif [ "$FRONT_CHANGED" = "true" ]; then
                          docker compose build --no-cache web
                      fi
                      docker compose up -d
