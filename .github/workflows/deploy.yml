name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Clean old source on server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      rm -rf /opt/reiz/front/src /opt/reiz/api/app /opt/reiz/api/prisma

            - name: Copy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: '.'
                  target: '/opt/reiz'

            - name: Create .env file for docker-compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd /opt/reiz
                      cat > .env << 'EOF'
                      API_SECRET=${{ secrets.API_SECRET }}
                      API_SALT=${{ secrets.API_SALT }}
                      TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
                      TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
                      AUTH_SECRET=${{ secrets.AUTH_SECRET }}
                      SERVICE_SECRET=${{ secrets.SERVICE_SECRET }}
                      GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                      GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                      TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
                      POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                      GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
                      GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
                      GMAIL_USER=${{ secrets.GMAIL_USER }}
                      GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
                      OUTREACH_DAILY_CAP=${{ vars.OUTREACH_DAILY_CAP || '5' }}
                      OUTREACH_PUBLIC_URL=${{ vars.OUTREACH_PUBLIC_URL || 'https://reiz.com.ua' }}
                      OUTREACH_SENDER_NAME=${{ vars.OUTREACH_SENDER_NAME || 'Марьян, основатель REIZ' }}
                      MAIL_USER=${{ secrets.MAIL_USER }}
                      MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
                      MAIL_DISPLAY_NAME=${{ vars.MAIL_DISPLAY_NAME || 'REIZ' }}
                      MAIL_IMAP_HOST=${{ vars.MAIL_IMAP_HOST || 'imap.hostinger.com' }}
                      MAIL_SMTP_HOST=${{ vars.MAIL_SMTP_HOST || 'smtp.hostinger.com' }}
                      EOF
                      chmod 600 .env

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd /opt/reiz
                      docker compose down
                      docker compose up --build -d
